name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions はコミットの SHA で固定する。更新は Dependabot(.github/dependabot.yml)が提案する。
jobs:
  # このジョブ名は、setup-repo.sh がブランチ保護の必須チェックに指定している。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .agents/hooks/self-test.sh
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # .agents/skills/ の写しが、インストール済みのパッケージに同梱されたスキルと同じであること。
      # Dependabot の更新 PR では自動で写し直される。手元で直すときは --check を外して実行する。
      - run: bash .github/scripts/sync-skills.sh --check
