name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # スキルを同梱するパッケージの更新では、.agents/skills/ の写しを PR ブランチ上で直す。
      - name: Checkout PR branch
        if: contains(steps.metadata.outputs.dependency-names, '@mizchi/mutator')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          # トークンは push する手順にだけ渡す。
          persist-credentials: false

      - name: Set up pnpm
        if: contains(steps.metadata.outputs.dependency-names, '@mizchi/mutator')
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        if: contains(steps.metadata.outputs.dependency-names, '@mizchi/mutator')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Sync bundled skills
        if: contains(steps.metadata.outputs.dependency-names, '@mizchi/mutator')
        run: |
          # このジョブは書き込み権限を持つため、更新直後のパッケージのスクリプトは実行しない。
          pnpm install --frozen-lockfile --ignore-scripts
          bash .github/scripts/sync-skills.sh

      - name: Commit synced skills
        if: contains(steps.metadata.outputs.dependency-names, '@mizchi/mutator')
        run: |
          git add .agents/skills .claude/skills
          if ! git diff --cached --quiet; then
            # [dependabot skip] を付けると、Dependabot はこのコミットがあってもリベースを続けられる。
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: スキルの写しを更新 [dependabot skip]'
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
          fi
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # スキル(エージェントへの指示)を変える更新は、写しの差分を人が確認してからマージする。
      - name: Approve PR
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && !contains(steps.metadata.outputs.dependency-names, '@mizchi/mutator')
        run: gh pr review "$PR_URL" --approve
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && !contains(steps.metadata.outputs.dependency-names, '@mizchi/mutator')
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
